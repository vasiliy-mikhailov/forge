    quantization: fp8
    kv_cache_dtype: fp8
    max_model_len: 262144
    rope_scaling:
      rope_type: yarn
      factor: 1.0
      original_max_position_embeddings: 262144
    tool_call_parser: qwen3_xml
    reasoning_parser: qwen3
    chat_template_kwargs:
      enable_thinking: false
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    bench_tier: A
    bench_skip: false
    notes: |
      Verified live via A8 (2026-04-25). Current default; passes T3
      end-to-end on skill v1. T4 quality below Opus baseline (16 vs 59
      concepts), see bench grade results.
      2026-05-03: max_model_len bumped 131072 → 262144 to use native
      256K context (model card: max_position_embeddings=262144, no
      rope_scaling required). YaRN block kept as a no-op
      (factor=1.0, original_max==max_model_len) per models.yml schema
      convention for native-context models.

